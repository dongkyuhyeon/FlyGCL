name: Audit MISA official initialization and Forward/Gradient
on:
  push:
    branches: [audit/misa-official-parity]
    paths:
      - '.github/workflows/audit-misa-official-parity.yml'
      - 'dongkyu_work/misa/scripts/verify_official_init_forward.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install torch CPU
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1
      - name: Install FlyGCL import dependencies
        run: python -m pip install timm==0.6.12 numpy==1.26.4 scipy==1.13.1 scikit-learn==1.6.0 pandas==2.2.3 matplotlib==3.9.4 opencv-python-headless==4.10.0.84 wandb==0.20.1
      - name: Check syntax
        run: python -m py_compile dongkyu_work/misa/scripts/verify_official_init_forward.py
      - name: Compare official and integrated MISA
        run: PYTHONPATH=. python -m dongkyu_work.misa.scripts.verify_official_init_forward
